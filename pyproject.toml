[build-system]
requires = ["setuptools>=40.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thgnn-shilling"
version = "0.1.0"
description = "Temporal Heterogeneous GNN for shilling attack detection in recommender systems"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torch-geometric",
    "transformers",
    "pandas",
    "numpy",
    "scikit-learn",
    "pyyaml",
    "wandb",
    "tqdm",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
markers = [
    "smoke:     Fast structural tests on synthetic data (no raw data required)",
    "subsample: 5%%-subsample integration test (requires raw data)",
    "full:      Validates completed results/raw/ against paper_runs.yaml",
]
