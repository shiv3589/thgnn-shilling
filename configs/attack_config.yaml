attack:
  type: random          # random | average | bandwagon | segment | probe
  filler_size: 50       # number of filler items per fake profile
  attack_size: 0.05     # fraction of total users injected as fake profiles
  target_items: []      # leave empty to sample randomly

  # Bandwagon-specific
  bandwagon:
    popular_items: 20

  # Segment-specific
  segment:
    segment_size: 10

evaluation:
  dataset: ml-1m
  metrics: [hr@10, ndcg@10, hit_ratio]
  victim_model_checkpoint: checkpoints/best.pt

output:
  attack_dir: data/attacks/
  report_path: outputs/attack_report.json
